<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 · XX县国有资产招租信息平台</title>
  <!-- Decap CMS：优先本地文件，回退到 CDN -->
  <script src="/admin/decap-cms.js"></script>
  <script>
    // 如果本地文件不存在，尝试从 unpkg 动态加载
    if (typeof window.CMS === 'undefined') {
      var cmsScript = document.createElement('script');
      cmsScript.src = 'https://unpkg.com/decap-cms@3.3.2/dist/decap-cms.js';
      cmsScript.onload = function() { console.log('[CMS] 从 unpkg 加载成功'); };
      cmsScript.onerror = function() {
        console.error('[CMS] 所有加载方式均失败');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      };
      document.head.appendChild(cmsScript);
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #666; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { display: none; max-width: 500px; margin: 60px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center; }
    .error h2 { margin: 0 0 12px; color: #c00; }
    .error p { margin: 6px 0; font-size: 14px; color: #555; line-height: 1.6; }
    .error a { color: #1a73e8; }
  </style>
</head>
<body>
  <!-- #root 必须在 CMS 脚本加载前存在 -->
  <div id="root"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>正在加载后台编辑器...</div>
    <div style="font-size:12px;color:#999;margin-top:8px;" id="statusText">检查本地文件...</div>
  </div>
  <div class="error" id="error">
    <h2>加载失败</h2>
    <p>请按 <strong>F12</strong> 查看 Console 和 Network 标签页。</p>
    <p>当前可能的问题：<br/>
       ① 浏览器安全策略阻止了外部脚本（Tracking Prevention）<br/>
       ② 需要将 decap-cms.js 放到 <code>public/admin/</code> 目录<br/>
       ③ 网络问题导致 CDN 资源无法加载</p>
    <p style="margin-top:12px;font-size:13px;color:#888;">
      解决方案：从 https://unpkg.com/decap-cms@3.3.2/dist/decap-cms.js 下载 JS 文件<br/>
      保存到项目的 <code>public/admin/decap-cms.js</code> 然后重新推送
    </p>
    <p style="margin-top:16px;"><a href="/">← 返回首页</a></p>
  </div>
  <script>
    (function() {
      var loading = document.getElementById('loading');
      var errorDiv = document.getElementById('error');
      var statusText = document.getElementById('statusText');
      var root = document.getElementById('root');
      var loaded = false;

      function showError(msg) {
        console.error('[CMS Init Error]', msg);
        if (loading) loading.style.display = 'none';
        if (errorDiv) {
          errorDiv.style.display = 'block';
          if (msg) errorDiv.querySelector('h2').textContent = msg;
        }
      }

      if (!root) {
        showError('致命错误：#root 容器未找到');
        return;
      }

      // 轮询检查 CMS 是否已渲染
      var checkTimer = setInterval(function() {
        if (window.CMS) {
          if (root && root.children.length > 0) {
            loaded = true;
            clearInterval(checkTimer);
            if (loading) loading.style.display = 'none';
            console.log('[CMS] 初始化成功');
          }
        }
      }, 1000);

      // 10秒超时兜底
      setTimeout(function() {
        if (!loaded) {
          clearInterval(checkTimer);
          if (statusText) statusText.textContent = '加载超时，请检查控制台...';
          if (!window.CMS) {
            showError('CMS 脚本未加载，请查看 F12 Console');
          }
        }
      }, 10000);

      // 捕获全局错误
      window.addEventListener('error', function(e) {
        console.error('[Global Error]', e.message, e.filename, e.lineno);
      });
    })();
  </script>
</body>
</html>
