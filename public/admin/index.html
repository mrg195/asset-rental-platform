<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 · XX县国有资产招租信息平台</title>
  <!-- 使用 unpkg 作为主CDN（国内访问正常，不会被 Tracking Prevention 拦截） -->
  <script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #666; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { display: none; max-width: 500px; margin: 60px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center; }
    .error h2 { margin: 0 0 12px; color: #c00; }
    .error p { margin: 6px 0; font-size: 14px; color: #555; line-height: 1.6; }
    .error a { color: #1a73e8; }
  </style>
</head>
<body>
  <!-- root 必须在 CMS 脚本加载前存在，确保 appendChild 不为 null -->
  <div id="root"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>正在加载后台编辑器...</div>
  </div>
  <div class="error" id="error">
    <h2>加载失败</h2>
    <p>请按 <strong>F12</strong> 查看 Console 和 Network 错误。</p>
    <p>常见原因：<br/>① 网络问题导致 CDN 资源未加载<br/>② config.yml 配置有误<br/>③ GitHub OAuth 未授权</p>
    <p style="margin-top:16px;"><a href="/">← 返回首页</a></p>
  </div>
  <script>
    (function() {
      var loading = document.getElementById('loading');
      var errorDiv = document.getElementById('error');
      var root = document.getElementById('root');

      // 安全检测：若 root 不存在则阻止 CMS 尝试挂载
      if (!root) {
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.querySelector('p').textContent = '错误：#root 容器未找到。请刷新页面重试。';
        return;
      }

      var loaded = false;

      function showError(msg) {
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
        if (msg) errorDiv.querySelector('h2').textContent = msg;
      }

      // 每2秒检查一次 CMS 是否已渲染到 #root
      var checkInterval = setInterval(function() {
        if (root && root.children.length > 0) {
          loaded = true;
          clearInterval(checkInterval);
          loading.style.display = 'none';
        }
      }, 2000);

      // 8秒超时兜底
      setTimeout(function() {
        if (!loaded) {
          clearInterval(checkInterval);
          showError('CMS 加载超时，请检查控制台错误后刷新页面');
        }
      }, 8000);
    })();
  </script>
</body>
</html>
