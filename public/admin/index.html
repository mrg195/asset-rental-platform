<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理</title>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="./decap-cms.js"></script>
  <style>
    #loading { position: fixed; inset: 0; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; z-index: 99999; }
    .dots span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #4fc3f7; margin: 0 4px; animation: bounce 1.4s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="loading">
    <div class="dots"><span></span><span></span><span></span></div>
    <p style="margin-top:16px;font-size:14px;opacity:0.7;">加载中...</p>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var root = document.getElementById('root');
      var loading = document.getElementById('loading');
      if (!window.CMS) {
        loading.innerHTML = '<h2>加载失败</h2><p>请按 F12 → Console 查看错误</p>';
        return;
      }
      window.CMS.init();
      // 监听 CMS 界面渲染（无论挂到 #root 还是自建容器），出现即隐藏遮罩
      var obs = new MutationObserver(function() {
        if (document.querySelector('.cms-root') || (root && root.children.length > 0)) {
          loading.style.display = 'none';
          obs.disconnect();
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      // 兜底：确实没渲染才提示
      setTimeout(function() {
        if (!document.querySelector('.cms-root') && (!root || root.children.length === 0)) {
          loading.innerHTML = '<h2>加载超时</h2><p>请按 F12 → Console 查看错误</p>';
        }
      }, 10000);
    });
  </script>
</body>
</html>
