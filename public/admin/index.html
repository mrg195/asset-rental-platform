<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 · XX县国有资产招租信息平台</title>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.3.0/dist/decap-cms.js"></script>
  <style>
    body { margin: 0; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: #666; font-size: 14px; }
    .error { display: none; padding: 40px; text-align: center; color: #c00; font-size: 14px; }
  </style>
</head>
<body>
  <div class="loading" id="loading">正在加载后台，请稍候...</div>
  <div class="error" id="error">
    <h2>加载失败</h2>
    <p>请按 F12 打开浏览器控制台，查看 Console 和 Network 标签页的错误信息。</p>
    <p>常见原因：<br/>① config.yml 未正确加载（检查路径）<br/>② 网络问题导致 CDN 资源未加载<br/>③ OAuth 授权配置有误</p>
    <p style="margin-top:20px;"><a href="/" target="_blank">返回首页</a></p>
  </div>
  <!-- Decap CMS 会挂载到 #root -->
  <div id="root"></div>
  <script>
    // 监控 CMS 加载状态
    var loading = document.getElementById('loading');
    var errorDiv = document.getElementById('error');
    var root = document.getElementById('root');

    // 5秒后若CMS未渲染，提示检查控制台
    setTimeout(function() {
      if (root && root.children.length === 0) {
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
      }
    }, 5000);

    // 捕获JS错误
    window.addEventListener('error', function(e) {
      console.error('[CMS Error]', e.message, e.filename, e.lineno);
    });
  </script>
</body>
</html>
