<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理</title>
  <!-- 先设置手动初始化标志，阻止 CMS 自动挂载 -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="./decap-cms.js"></script>
  <style>
    body { margin: 0; background: #1a1a2e; color: #eee; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .box { text-align: center; }
    .dots span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #4fc3f7; margin: 0 4px; animation: bounce 1.4s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
  </style>
</head>
<body>
  <!-- #root 在 CMS 脚本执行前就已存在 -->
  <div id="root"></div>
  <div class="box" id="loading">
    <div class="dots"><span></span><span></span><span></span></div>
    <p style="margin-top:16px;font-size:14px;opacity:0.7;">加载中...</p>
  </div>
  <script>
    // DOM 加载完成后手动初始化 CMS，确保 #root 已就绪
    document.addEventListener('DOMContentLoaded', function() {
      var root = document.getElementById('root');
      if (!root || !window.CMS) {
        document.getElementById('loading').innerHTML = '<h2>加载失败</h2><p>CMS 脚本未找到</p>';
        return;
      }
      window.CMS.init();
      // 超时检测
      setTimeout(function() {
        if (root.children.length === 0) {
          document.getElementById('loading').innerHTML = '<h2>加载超时</h2><p>请按 F12 → Console 查看错误</p>';
        }
      }, 8000);
    });
  </script>
</body>
</html>
