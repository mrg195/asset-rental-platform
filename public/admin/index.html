<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理</title>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="./decap-cms.js"></script>
  <style>
    #loading { position: fixed; inset: 0; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; z-index: 99999; cursor: pointer; }
    .dots span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #4fc3f7; margin: 0 4px; animation: bounce 1.4s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="nc-root"></div>
  <div id="loading">
    <div class="dots"><span></span><span></span><span></span></div>
    <p style="margin-top:16px;font-size:14px;opacity:0.7;">加载中...（若卡住可点击此区域）</p>
  </div>
  <script>
    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    }
    function cmsRendered() {
      return !!document.querySelector('.cms-root') ||
             !!document.querySelector('#nc-root > *') ||
             !!document.querySelector('#root > *');
    }
    document.addEventListener('DOMContentLoaded', function() {
      if (!window.CMS) {
        document.getElementById('loading').innerHTML = '<h2>加载失败</h2><p>CMS 脚本未加载</p>';
        return;
      }
      try {
        // 官方文档：script 标签方式下，手动初始化使用 window.initCMS()
        if (typeof window.initCMS === 'function') {
          window.initCMS();
        } else if (typeof window.CMS.init === 'function') {
          window.CMS.init();
        }
      } catch (e) {
        console.error('[CMS] init 异常:', e);
      }
      // 渲染检测：出现 CMS 界面即隐藏遮罩
      var obs = new MutationObserver(function() {
        if (cmsRendered()) { hideLoading(); obs.disconnect(); }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      // 兜底超时
      setTimeout(function() {
        if (!cmsRendered()) {
          document.getElementById('loading').innerHTML = '<h2>加载超时</h2><p>请按 F12 → Console 查看错误</p>';
        }
      }, 12000);
    });
    // 手动点击遮罩可强制查看（防检测失效）
    document.getElementById('loading').addEventListener('click', hideLoading);
  </script>
</body>
</html>
