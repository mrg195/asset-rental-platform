<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 · XX县国有资产招租信息平台</title>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.3.0/dist/decap-cms.js"></script>
  <style>
    body { margin: 0; background: #1a3a6b; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .fallback { text-align: center; padding: 40px; }
    .fallback h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: 1px; }
    .fallback p { margin: 0; opacity: 0.8; font-size: 14px; }
  </style>
</head>
<body>
  <noscript>
    <div class="fallback">
      <h1>请启用 JavaScript 以加载后台编辑器</h1>
      <p>Decap CMS 需要 JavaScript 运行环境。</p>
    </div>
  </noscript>
  <script>
    // Decap CMS 会自动加载同目录下的 config.yml
    // 若遇到空白页，请检查浏览器控制台（F12）的错误信息。
    window.addEventListener('load', () => {
      const cmsContainer = document.querySelector('.cms-root, #cms-root');
      if (cmsContainer && !cmsContainer.children.length) {
        document.body.innerHTML = '<div class="fallback"><h1>CMS 未正确初始化</h1><p>请检查 network 面板与 console 错误，确保 config.yml 配置正确。</p></div>';
      }
    });
  </script>
</body>
</html>
